name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  browser:
    name: Single-page browser acceptance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run deterministic browser scenarios using installed Chrome
        shell: pwsh
        run: |
          $env:READVIDEO_BROWSER_CHANNEL = 'chrome'
          npm run test:browser
